          example: https://bo.nalog.gov.ru/download/bfo/pdf/52634181
        indicators:
          type: object
          description: Суммы в рублях. В скобках — код строки отчётности.
          properties:
            non_current_assets:
              type: integer
              nullable: true
              description: Внеоборотные активы (1100)
            fixed_assets:
              type: integer
              nullable: true
              description: Основные средства (1150)
            current_assets:
              type: integer
              nullable: true
              description: Оборотные активы (1200)
            receivables:
              type: integer
              nullable: true
              description: Дебиторская задолженность (1230)
