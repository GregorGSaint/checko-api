            equity:
              type: integer
              nullable: true
              description: Капитал и резервы (1300)
            long_term_liabilities:
              type: integer
              nullable: true
              description: Долгосрочные обязательства (1400)
            short_term_liabilities:
              type: integer
              nullable: true
              description: Краткосрочные обязательства (1500)
            total_assets:
              type: integer
              nullable: true
              description: Баланс, актив (1600)
            total_equity_and_liabilities:
              type: integer
              nullable: true
              description: Баланс, пассив (1700)
            gross_profit:
              type: integer
              nullable: true
              description: Валовая прибыль (2100)
            revenue:
              type: integer
              nullable: true
              description: Выручка (2110)
              example: 544581317000
            cost_of_sales:
              type: integer
              nullable: true
              description: Себестоимость продаж (2120)
            sales_profit:
              type: integer
              nullable: true
              description: Прибыль от продаж (2200)
            profit_before_tax:
              type: integer
              nullable: true
              description: Прибыль до налогообложения (2300)
            net_profit:
              type: integer
              nullable: true
              description: Чистая прибыль (2400)
              example: -11681168000
