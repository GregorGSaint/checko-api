openapi: 3.0.3
info:
  title: Checko API
  version: 1.0.0
  description: |
    REST API для получения сведений об организациях и индивидуальных предпринимателях
    из [Checko](https://checko.ru): данные ЕГРЮЛ и ЕГРИП, бухгалтерская отчётность, поиск.

    Сервис не пересылает ответ источника как есть. Поля переименованы в латиницу, вложенные
    блоки приведены к единому виду, коды строк бухгалтерской отчётности переведены в именованные
    показатели, а производные метрики посчитаны на стороне сервиса. Исходный ответ доступен
    через параметр `raw=true`.

    **Авторизация.** Все ресурсы `/v1` требуют заголовок `Authorization: Bearer <token>`.
    Демо-токен: `demo-checko-api-token`. Нажмите Authorize и вставьте его.

    **Кэш.** Ответы источника хранятся в SQLite: карточки 24 часа, отчётность 30 дней, поиск 1 час,
    «не найдено» 1 час. Заголовок `X-Cache` показывает, откуда взят ответ. Если источник недоступен,
    а в кэше есть устаревшая копия, сервис отдаёт её с `X-Cache: STALE` и заголовком `Warning`.

    **Демо-режим.** Без ключа Checko сервис отвечает записанными ответами источника
    (`X-Data-Source: fixtures`). Доступны ПАО Сбербанк (7707083893), ООО Яндекс (7736207543)
    и ИП Морозов А. С. (402907671076).

    **Ошибки** возвращаются в формате RFC 9457 (`application/problem+json`) с машиночитаемым полем `code`.
servers:
  - url: /
tags:
  - name: Организации
    description: Сведения ЕГРЮЛ, отчётность и коллекции организации
  - name: Индивидуальные предприниматели
    description: Сведения ЕГРИП
  - name: Поиск
    description: Поиск по названию, ФИО, ОКВЭД, датам и контактам
  - name: Служебное
    description: Список ресурсов и состояние сервиса
security:
  - bearerAuth: []

paths:
  /v1:
    get:
      tags: [Служебное]
      summary: Список ресурсов
      operationId: listResources
      responses:
        '200':
          description: Ресурсы API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TokenLimitExceeded'

  /v1/companies/{id}:
    get:
      tags: [Организации]
      summary: Карточка организации
      description: |
        Сведения ЕГРЮЛ по ИНН (10 цифр) или ОГРН (13 цифр). Контрольное число проверяется до обращения
        к источнику, поэтому опечатка не расходует квоту. Тяжёлые коллекции (товарные знаки, лицензии,
        филиалы, учредители) в карточку не входят: в `collections` их размеры, сами записи — в подресурсах.
      operationId: getCompany
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Raw'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Карточка организации
          headers:
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Data-Source:
              $ref: '#/components/headers/XDataSource'
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
                  links:
                    $ref: '#/components/schemas/CompanyLinks'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TokenLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/companies/{id}/finances:
    get:
      tags: [Организации]
      summary: Бухгалтерская отчётность
      description: |
        Отчётность за все доступные годы, новые сверху. Источник отдаёт коды строк форм по приказу
        Минфина № 66н; сервис переводит итоговые строки в именованные показатели и считает метрики.
        Метрика равна `null`, если для неё не хватает данных: ноль вместо отсутствующей строки не подставляется.
        У банков и страховых компаний отчётность по этим формам отсутствует: `has_statements: false`.
      operationId: getCompanyFinances
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Raw'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Отчётность по годам
          headers:
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/FinancialStatements'
                  links:
                    type: object
                    properties:
                      company:
                        type: string
                        example: /v1/companies/7736207543
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/companies/{id}/trademarks:
    get:
      tags: [Организации]
      summary: Товарные знаки
      description: Читается из того же ответа источника, что и карточка; повторного запроса к Checko не делает.
      operationId: listCompanyTrademarks
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Страница товарных знаков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrademarkPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/companies/{id}/licenses:
    get:
      tags: [Организации]
      summary: Лицензии
      operationId: listCompanyLicenses
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Страница лицензий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/companies/{id}/branches:
    get:
      tags: [Организации]
      summary: Филиалы и представительства
      operationId: listCompanyBranches
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Страница подразделений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/companies/{id}/founders:
    get:
      tags: [Организации]
      summary: Учредители
      description: |
        Физические лица, российские и иностранные организации, ПИФы и публичные образования.
        Если сведения закрыты по закону, запись сохраняется с `access_restricted: true` и пустыми полями.
      operationId: listCompanyFounders
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Страница учредителей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FounderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/entrepreneurs/{id}:
    get:
      tags: [Индивидуальные предприниматели]
      summary: Карточка ИП
      description: Сведения ЕГРИП по ИНН (12 цифр) или ОГРНИП (15 цифр).
      operationId: getEntrepreneur
      parameters:
        - $ref: '#/components/parameters/EntrepreneurId'
        - $ref: '#/components/parameters/Raw'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Карточка ИП
          headers:
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Entrepreneur'
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: /v1/entrepreneurs/402907671076
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/search:
    get:
      tags: [Поиск]
      summary: Поиск организаций и ИП
      description: |
        Параметры проверяются до обращения к источнику. Поиск по учредителю, руководителю, телефону
        и почте доступен только для организаций. `total` — число найденных записей по данным источника;
        источник ограничивает его значением 1000, поэтому 1000 означает «1000 и более».
      operationId: search
      parameters:
        - name: by
          in: query
          required: true
          description: Поле поиска
          schema:
            type: string
            enum: [name, founder-name, leader-name, okved, reg-date, upd-date, phone, email]
        - name: query
          in: query
          required: true
          description: |
            Текст запроса. Для `name`, `founder-name`, `leader-name` — не меньше 4 символов;
            `okved` — код вида 62.01; даты — ГГГГ-ММ-ДД; телефон — +7XXXXXXXXXX или 8XXXXXXXXXX.
          schema:
            type: string
          example: яндекс
        - name: obj
          in: query
          description: org — организации, ent — ИП
          schema:
            type: string
            enum: [org, ent]
            default: org
        - name: region
          in: query
          description: Код региона, две цифры
          schema:
            type: string
            pattern: '^\d{2}$'
          example: '77'
        - name: active
          in: query
          description: Только действующие
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          description: Записей на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/Raw'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /health:
    get:
      tags: [Служебное]
      summary: Состояние сервиса
      description: Доступность БД и расход суточной квоты источника по последнему ответу Checko.
      operationId: health
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Демо-токен: demo-checko-api-token. Свой токен: bin/console token:create <имя>'

  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: ИНН (10 цифр) или ОГРН (13 цифр)
      schema:
        type: string
        pattern: '^\d{10}$|^\d{13}$'
      examples:
        sber:
          summary: ПАО Сбербанк, ИНН
          value: '7707083893'
        yandex:
          summary: ООО Яндекс, ОГРН
          value: '1027700229193'
    EntrepreneurId:
      name: id
      in: path
      required: true
      description: ИНН (12 цифр) или ОГРНИП (15 цифр)
      schema:
        type: string
        pattern: '^\d{12}$|^\d{15}$'
      example: '402907671076'
    Raw:
      name: raw
      in: query
      description: Вернуть исходный ответ источника без служебного блока meta
      schema:
        type: boolean
        default: false
    Refresh:
      name: refresh
      in: query
      description: Обойти кэш и запросить источник заново (расходует квоту)
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    CollectionLimit:
      name: limit
      in: query
      description: Записей на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  headers:
    XCache:
      description: HIT — из кэша, MISS — из источника, STALE — устаревшая копия при недоступном источнике
      schema:
        type: string
        enum: [HIT, MISS, STALE]
    XDataSource:
      description: live — данные Checko, fixtures — демо-режим на записанных ответах
      schema:
        type: string
        enum: [live, fixtures]
    RetryAfter:
      description: Через сколько секунд имеет смысл повторить запрос
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Нет токена, токен неизвестен или отключён
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="checko-api"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Требуется авторизация
            status: 401
            detail: 'Передайте токен в заголовке Authorization: Bearer <token>'
            code: UNAUTHORIZED
            request_id: 91149e76d86d54d0
    NotFound:
      description: Организация или ИП не найдены (COMPANY_NOT_FOUND, ENTREPRENEUR_NOT_FOUND) либо неизвестный маршрут (ROUTE_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Не найдено
            status: 404
            detail: Не найдено ни одной организации с указанными реквизитами
            code: COMPANY_NOT_FOUND
            request_id: 91149e76d86d54d0
    ValidationFailed:
      description: |
        Некорректные параметры, к источнику запрос не отправлялся.
        INVALID_IDENTIFIER — формат или контрольное число; WRONG_RESOURCE — идентификатор ИП на ресурсе организаций
        и наоборот; INVALID_PARAMETER — параметры поиска и пагинации.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  parameter:
                    type: string
                    description: Параметр, не прошедший проверку
          example:
            type: about:blank
            title: Некорректный запрос
            status: 422
            detail: ИНН 7707083894 не прошёл проверку контрольного числа
            code: INVALID_IDENTIFIER
            request_id: 91149e76d86d54d0
            parameter: id
    TokenLimitExceeded:
      description: Исчерпан суточный лимит токена (TOKEN_LIMIT_EXCEEDED), сброс в полночь по Москве
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка (INTERNAL_ERROR) или источник отклонил параметры, собранные сервисом (UPSTREAM_REJECTED_REQUEST)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: |
        Источник ответил ошибкой 5xx или сеть недоступна (UPSTREAM_UNAVAILABLE), отверг ключ сервиса
        (UPSTREAM_AUTH_FAILED) или вернул ответ неожиданного формата (UPSTREAM_INVALID_RESPONSE).
        Ключ сервиса — не ключ клиента, поэтому это 502, а не 401.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Исчерпана суточная квота источника (QUOTA_EXHAUSTED) или источник ограничил частоту запросов (UPSTREAM_RATE_LIMITED)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Источник не ответил за отведённое время после повторных попыток (UPSTREAM_TIMEOUT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - TOKEN_LIMIT_EXCEEDED
            - ROUTE_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INVALID_IDENTIFIER
            - WRONG_RESOURCE
            - INVALID_PARAMETER
            - COMPANY_NOT_FOUND
            - ENTREPRENEUR_NOT_FOUND
            - QUOTA_EXHAUSTED
            - UPSTREAM_RATE_LIMITED
            - UPSTREAM_TIMEOUT
            - UPSTREAM_UNAVAILABLE
            - UPSTREAM_AUTH_FAILED
            - UPSTREAM_INVALID_RESPONSE
            - UPSTREAM_REJECTED_REQUEST
            - INTERNAL_ERROR
        request_id:
          type: string
          description: Совпадает с заголовком X-Request-Id и полем request_id в журнале

    Meta:
      type: object
      required: [cache, fetched_at]
      properties:
        cache:
          type: string
          enum: [HIT, MISS, STALE]
        fetched_at:
          type: string
          format: date-time
          description: Когда данные получены из источника
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, per_page, pages_total, has_next]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          nullable: true
        pages_total:
          type: integer
        has_next:
          type: boolean

    CodeName:
      type: object
      properties:
        code:
          type: string
          nullable: true
        name:
          type: string
          nullable: true

    Activity:
      type: object
      properties:
        code:
          type: string
          example: '64.19'
        name:
          type: string
          nullable: true
          example: Денежное посредничество прочее
        version:
          type: string
          nullable: true
          example: '2014'

    Status:
      type: object
      properties:
        code:
          type: string
          nullable: true
          example: '001'
        name:
          type: string
          nullable: true
          example: Действует
        since:
          type: string
          format: date
          nullable: true

    Termination:
      type: object
      nullable: true
      properties:
        date:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true

    Contacts:
      type: object
      properties:
        phones:
          type: array
          items:
            type: string
          example: ['+78005555777']
        emails:
          type: array
          items:
            type: string
          example: [sberbank@sberbank.ru]
        website:
          type: string
          nullable: true
          example: https://sberbank.ru

    Taxes:
      type: object
      properties:
        special_regimes:
          type: array
          items:
            type: string
          example: [УСН]
        paid_total:
          type: number
          nullable: true
        paid_year:
          type: string
          nullable: true
        arrears:
          type: number
          nullable: true
        arrears_date:
          type: string
          nullable: true

    Sme:
      type: object
      nullable: true
      description: Запись в реестре МСП
      properties:
        category:
          type: string
