services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app
      - storage:/app/storage

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  storage:
